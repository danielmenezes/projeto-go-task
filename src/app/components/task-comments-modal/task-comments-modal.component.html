<div class="rounded-xl overflow-scroll bg-white mx-h-[500] scrollbar-hidden">
  <div class="p-4 flex gap-1">
    <img src="images/icon-task-star.svg" />
    <h1 class="font-semibold text-lg">Comentar tarefa</h1>
    <img
      class="ml-auto cursor-pointer"
      src="images/icon-close.svg"
      (click)="onCloseModal()"
    />
  </div>
  <div class="p-4 border-t border-[#D1D5DB]">
    <h1 class="font-semibold text-lg mb-4">Minha nova tarefa</h1>
    <p class="font-semibold text-sm mb-2">Descrição</p>
    <p class="font-normal text-base text-[#374151]">
      Esssa é a minha terefa para criar um projeto Angular
    </p>
  </div>
  <div class="p-4">
    <div class="bg-[#F3F4F6] p-5 rounded-xl flex flex-col gap-5">
      <div>
        <p class="font-bold text-sm">Comentário</p>
      </div>
      <div class="flex items-start gap-2">
        <div class="flex flex-col w-full">
          <input
            class="rounded-lg border border-[#D1D5DB] p-3 bg-white flex-1 text-sm font-light"
            type="text"
            placeholder="Adicione um comentário"
            [formControl]="commentControl"
          />
        </div>
        <button
          class="{{ `py-3 px-4 rounded-xl text-white  text-sm font-semibold cursor-pointer
          ${ commentControl.invalid 
            ? 'bg-[#D7D8D8]' 
            : 'bg-[#2A89EF] active:translate-y-1 transition-transform duration-75 shadow-md shadow-blue-500/50'}` }}"
          [disabled]="commentControl.invalid"
          (click)="addComment()"
        >
          Adicionar
        </button>
      </div>
      <div
        class="flex flex-col gap-5 overflow-scroll max-h-44 scrollbar-hidden"
      >
        @for (comment of _task.comments; track comment.id; let last = $last) {
          <!-- Comentário -->
          <div
            class="{{ `flex flex-col gap-3 ${last ? '' : 'border-b border-[#E5E7EB] pb-3'}` }}"
          >
            <div>
              <p class="font-light text-sm text-[#374151]">
                {{ comment.description }}
              </p>
            </div>
            <div class="{{ `flex gap-4 ${last ? '' : 'mb-3'}` }}">
              <p class="font-normal text-sm text-[#9CA3AF]">
                Comentado há 10 min atrás
              </p>
              <p
                class="font-semibold text-sx underline underline-offset-2 cursor-pointer"
                (click)="deleteComment(comment.id)"
              >
                Apagar
              </p>
            </div>
          </div>
          <!-- Fim comentário -->
        }
      </div>
    </div>
  </div>
</div>
